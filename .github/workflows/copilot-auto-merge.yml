name: Copilot auto-merge

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: copilot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: [self-hosted, certigo-ci]
    steps:
      - name: Approve and merge Copilot pull requests
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // 1. Release any workflow run stuck awaiting manual approval.
            try {
              const waiting = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, status: 'action_required', per_page: 50,
              });
              for (const run of waiting.data.workflow_runs) {
                try {
                  await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                  core.info(`Approved workflow run ${run.id}.`);
                } catch (e) {
                  core.info(`Could not approve run ${run.id}: ${e.message}`);
                }
              }
            } catch (e) {
              core.info(`Could not list pending runs: ${e.message}`);
            }

            // 2. Collect open, non-draft pull requests authored by Copilot.
            const all = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const targets = all.filter(
              (pr) => !pr.draft && /copilot/i.test(pr.user?.login ?? '')
            );

            if (targets.length === 0) {
              core.info('No open Copilot pull requests.');
              return;
            }

            for (const pr of targets) {
              core.startGroup(`PR #${pr.number} - ${pr.title}`);

              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number: pr.number, event: 'APPROVE',
                });
                core.info('Approved.');
              } catch (e) {
                core.info(`Approval skipped: ${e.message}`);
              }

              // Arm native auto-merge so the PR merges as soon as checks go green.
              try {
                await github.graphql(
                  `mutation ($id: ID!) {
                     enablePullRequestAutoMerge(
                       input: { pullRequestId: $id, mergeMethod: SQUASH }
                     ) { clientMutationId }
                   }`,
                  { id: pr.node_id }
                );
                core.info('Auto-merge armed.');
              } catch (e) {
                core.info(`Auto-merge not armed: ${e.message}`);
              }

              // If the PR is already mergeable, merge it right now.
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, merge_method: 'squash',
                });
                core.info('Merged.');
              } catch (e) {
                core.info(`Immediate merge not possible: ${e.message}`);
              }

              core.endGroup();
            }
