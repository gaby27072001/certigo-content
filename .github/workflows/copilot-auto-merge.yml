name: Copilot auto-merge

# Approuve et fusionne automatiquement les pull requests ouvertes par Copilot.
# Volontairement ecrit en shell pur (curl + jq) : les runners self-hosted
# echouent par intermittence a telecharger des actions externes.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: copilot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: [self-hosted, certigo-ci]
    steps:
      - name: Approve and merge Copilot pull requests
        env:
          TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          GQL: ${{ github.graphql_url }}
        run: |
          set -uo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq introuvable sur ce runner - arret."
            exit 1
          fi

          api() {
            # api <METHOD> <PATH> [BODY]
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -sS -X "$method" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "$body" "$API$path"
            else
              curl -sS -X "$method" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API$path"
            fi
          }

          # 1. Recupere les PR ouvertes, non-brouillon, ecrites par Copilot.
          prs=$(api GET "/repos/$REPO/pulls?state=open&per_page=100" \
            | jq -r '.[]
                     | select(.draft == false)
                     | select(((.user.login // "") | ascii_downcase | test("copilot")))
                     | "\(.number) \(.node_id) \(.head.ref)"')

          if [ -z "$prs" ]; then
            echo "Aucune pull request Copilot ouverte."
            exit 0
          fi

          # 2. Debloque uniquement les executions en attente liees a ces PR.
          #    (ne jamais approuver en masse : cela saturerait les runners)
          branches=$(echo "$prs" | awk '{print $3}')
          pending=$(api GET "/repos/$REPO/actions/runs?status=action_required&per_page=100" \
            | jq -r '.workflow_runs[]? | "\(.id) \(.head_branch)"' 2>/dev/null || true)

          echo "$pending" | while read -r rid rbranch; do
            [ -z "$rid" ] && continue
            if echo "$branches" | grep -Fxq "$rbranch"; then
              api POST "/repos/$REPO/actions/runs/$rid/approve" >/dev/null 2>&1 \
                && echo "Execution $rid ($rbranch) approuvee." \
                || echo "Execution $rid ($rbranch) non approuvable."
            fi
          done

          echo "$prs" | while read -r num node ref; do
            [ -z "$num" ] && continue
            echo "::group::PR #$num"

            # Approbation
            api POST "/repos/$REPO/pulls/$num/reviews" '{"event":"APPROVE"}' \
              | jq -r 'if .state then "Approuvee." else "Approbation ignoree: \(.message // "inconnue")" end'

            # Arme l'auto-merge natif : fusionnera des que la CI est verte.
            gql=$(printf '{"query":"mutation { enablePullRequestAutoMerge(input: {pullRequestId: \\"%s\\", mergeMethod: SQUASH}) { clientMutationId } }"}' "$node")
            curl -sS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$gql" "$GQL" \
              | jq -r 'if .errors then "Auto-merge non arme: \(.errors[0].message)" else "Auto-merge arme." end'

            # Fusionne immediatement si deja possible.
            api PUT "/repos/$REPO/pulls/$num/merge" '{"merge_method":"squash"}' \
              | jq -r 'if .merged == true then "Fusionnee." else "Pas encore fusionnable: \(.message // "en attente")" end'

            echo "::endgroup::"
          done
