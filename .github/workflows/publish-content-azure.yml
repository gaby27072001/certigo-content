name: publish-content-azure

on:
  workflow_dispatch:
    inputs: {}

concurrency:
  group: publish-content-azure-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.identity.outputs.release_id }}
      public_manifest_id: ${{ steps.identity.outputs.public_manifest_id }}
      private_manifest_id: ${{ steps.identity.outputs.private_manifest_id }}
      release_storage_target: ${{ steps.topology.outputs.release_storage_target }}
      public_storage_target: ${{ steps.topology.outputs.public_storage_target }}
      private_storage_target: ${{ steps.topology.outputs.private_storage_target }}
      release_client_id: ${{ steps.topology.outputs.release_client_id }}
      public_client_id: ${{ steps.topology.outputs.public_client_id }}
      private_client_id: ${{ steps.topology.outputs.private_client_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked tooling
        run: npm ci

      - name: Validate publication feature and topology
        id: topology
        shell: bash
        env:
          CONTENT_PUBLISH_ENABLED: ${{ vars.CONTENT_PUBLISH_ENABLED }}
          RELEASE_STORAGE_TARGET: ${{ vars.AZURE_RELEASE_STORAGE_TARGET }}
          PUBLIC_STORAGE_TARGET: ${{ vars.AZURE_PUBLIC_STORAGE_TARGET }}
          PRIVATE_STORAGE_TARGET: ${{ vars.AZURE_ANSWER_KEY_STORAGE_TARGET }}
          RELEASE_CLIENT_ID: ${{ vars.AZURE_RELEASE_CLIENT_ID }}
          PUBLIC_CLIENT_ID: ${{ vars.AZURE_PUBLIC_CLIENT_ID }}
          PRIVATE_CLIENT_ID: ${{ vars.AZURE_ANSWER_KEY_CLIENT_ID }}
        run: |
          test "${CONTENT_PUBLISH_ENABLED}" = "true"
          : "${RELEASE_STORAGE_TARGET:?Configure AZURE_RELEASE_STORAGE_TARGET}"
          : "${PUBLIC_STORAGE_TARGET:?Configure AZURE_PUBLIC_STORAGE_TARGET}"
          : "${PRIVATE_STORAGE_TARGET:?Configure AZURE_ANSWER_KEY_STORAGE_TARGET}"
          : "${RELEASE_CLIENT_ID:?Configure AZURE_RELEASE_CLIENT_ID}"
          : "${PUBLIC_CLIENT_ID:?Configure AZURE_PUBLIC_CLIENT_ID}"
          : "${PRIVATE_CLIENT_ID:?Configure AZURE_ANSWER_KEY_CLIENT_ID}"
          [[ "${RELEASE_STORAGE_TARGET}" =~ ^[a-z0-9]{3,24}/content-release-descriptors$ ]]
          [[ "${PUBLIC_STORAGE_TARGET}" =~ ^[a-z0-9]{3,24}/content-public-releases$ ]]
          [[ "${PRIVATE_STORAGE_TARGET}" =~ ^[a-z0-9]{3,24}/content-private-releases$ ]]
          [[ "${RELEASE_CLIENT_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ "${PUBLIC_CLIENT_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ "${PRIVATE_CLIENT_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          RELEASE_CLIENT_ID="${RELEASE_CLIENT_ID,,}"
          PUBLIC_CLIENT_ID="${PUBLIC_CLIENT_ID,,}"
          PRIVATE_CLIENT_ID="${PRIVATE_CLIENT_ID,,}"
          test "$(printf '%s\n' "${RELEASE_STORAGE_TARGET}" "${PUBLIC_STORAGE_TARGET}" "${PRIVATE_STORAGE_TARGET}" | sort -u | wc -l)" -eq 3
          test "$(printf '%s\n' "${RELEASE_CLIENT_ID}" "${PUBLIC_CLIENT_ID}" "${PRIVATE_CLIENT_ID}" | sort -u | wc -l)" -eq 3
          {
            echo "release_storage_target=${RELEASE_STORAGE_TARGET}"
            echo "public_storage_target=${PUBLIC_STORAGE_TARGET}"
            echo "private_storage_target=${PRIVATE_STORAGE_TARGET}"
            echo "release_client_id=${RELEASE_CLIENT_ID}"
            echo "public_client_id=${PUBLIC_CLIENT_ID}"
            echo "private_client_id=${PRIVATE_CLIENT_ID}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run publication gates
        run: |
          npm test
          npm run validate
          npm run manifest:check
          npm run policy:artifact-access
          npm run package
          npm run package:verify

      - name: Resolve immutable identities
        id: identity
        shell: bash
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const report = JSON.parse(fs.readFileSync('dist/reports/package-summary.json', 'utf8'));
            for (const field of ['releaseId', 'publicManifestId', 'privateManifestId']) {
              if (!/^sha256:[0-9a-f]{64}$/.test(report[field] ?? '')) {
                throw new Error('package summary runtime incomplet: ' + field);
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              'release_id=' + report.releaseId + '\n' +
              'public_manifest_id=' + report.publicManifestId + '\n' +
              'private_manifest_id=' + report.privateManifestId + '\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Candidat de publication\n\n' +
              '| Surface | Identite |\n| --- | --- |\n' +
              '| descriptor | \`' + report.releaseId + '\` |\n' +
              '| public | \`' + report.publicManifestId + '\` |\n' +
              '| answer-key | \`' + report.privateManifestId + '\` |\n');
          "

  publish-public:
    needs: plan
    environment: azure-content-public
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_LOGIN_PRE_CLEANUP: true
      AZURE_LOGIN_POST_CLEANUP: true
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked tooling
        run: npm ci
      - name: Rebuild and verify release
        env:
          EXPECTED_MANIFEST_ID: ${{ needs.plan.outputs.public_manifest_id }}
        run: |
          npm run package
          npm run package:verify
          test "$(node -p "require('./dist/public/manifest.json').manifestId")" = "${EXPECTED_MANIFEST_ID}"
      - name: Validate public environment variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          EXPECTED_CLIENT_ID: ${{ needs.plan.outputs.public_client_id }}
          EXPECTED_STORAGE_TARGET: ${{ needs.plan.outputs.public_storage_target }}
        run: |
          : "${AZURE_CLIENT_ID:?Configure AZURE_CLIENT_ID in azure-content-public}"
          : "${AZURE_TENANT_ID:?Configure AZURE_TENANT_ID in azure-content-public}"
          : "${AZURE_SUBSCRIPTION_ID:?Configure AZURE_SUBSCRIPTION_ID in azure-content-public}"
          : "${AZURE_RESOURCE_GROUP:?Configure AZURE_RESOURCE_GROUP in azure-content-public}"
          : "${AZURE_STORAGE_ACCOUNT:?Configure AZURE_STORAGE_ACCOUNT in azure-content-public}"
          : "${AZURE_STORAGE_CONTAINER:?Configure AZURE_STORAGE_CONTAINER in azure-content-public}"
          test "${AZURE_CLIENT_ID,,}" = "${EXPECTED_CLIENT_ID}"
          test "${AZURE_STORAGE_ACCOUNT}/${AZURE_STORAGE_CONTAINER}" = "${EXPECTED_STORAGE_TARGET}"
      - name: Login to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Publish and verify public blobs
        shell: bash
        env:
          MANIFEST_ID: ${{ needs.plan.outputs.public_manifest_id }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          bash tools/publish_blob_artifact.sh dist/public \
            "${AZURE_RESOURCE_GROUP}" "${AZURE_STORAGE_ACCOUNT}" "${AZURE_STORAGE_CONTAINER}" \
            "manifests/${MANIFEST_ID}" "public,max-age=31536000,immutable" manifestId

  publish-answer-key:
    needs: plan
    environment: azure-content-answer-key
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_LOGIN_PRE_CLEANUP: true
      AZURE_LOGIN_POST_CLEANUP: true
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked tooling
        run: npm ci
      - name: Rebuild and verify release
        env:
          EXPECTED_MANIFEST_ID: ${{ needs.plan.outputs.private_manifest_id }}
        run: |
          npm run package
          npm run package:verify
          test "$(node -p "require('./dist/private/manifest.json').manifestId")" = "${EXPECTED_MANIFEST_ID}"
      - name: Validate answer key environment variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          EXPECTED_CLIENT_ID: ${{ needs.plan.outputs.private_client_id }}
          EXPECTED_STORAGE_TARGET: ${{ needs.plan.outputs.private_storage_target }}
        run: |
          : "${AZURE_CLIENT_ID:?Configure AZURE_CLIENT_ID in azure-content-answer-key}"
          : "${AZURE_TENANT_ID:?Configure AZURE_TENANT_ID in azure-content-answer-key}"
          : "${AZURE_SUBSCRIPTION_ID:?Configure AZURE_SUBSCRIPTION_ID in azure-content-answer-key}"
          : "${AZURE_RESOURCE_GROUP:?Configure AZURE_RESOURCE_GROUP in azure-content-answer-key}"
          : "${AZURE_STORAGE_ACCOUNT:?Configure AZURE_STORAGE_ACCOUNT in azure-content-answer-key}"
          : "${AZURE_STORAGE_CONTAINER:?Configure AZURE_STORAGE_CONTAINER in azure-content-answer-key}"
          test "${AZURE_CLIENT_ID,,}" = "${EXPECTED_CLIENT_ID}"
          test "${AZURE_STORAGE_ACCOUNT}/${AZURE_STORAGE_CONTAINER}" = "${EXPECTED_STORAGE_TARGET}"
      - name: Login to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Publish and verify answer key blobs
        shell: bash
        env:
          MANIFEST_ID: ${{ needs.plan.outputs.private_manifest_id }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          bash tools/publish_blob_artifact.sh dist/private \
            "${AZURE_RESOURCE_GROUP}" "${AZURE_STORAGE_ACCOUNT}" "${AZURE_STORAGE_CONTAINER}" \
            "manifests/${MANIFEST_ID}" "private,no-store" manifestId

  publish-release:
    needs: [plan, publish-public, publish-answer-key]
    environment: azure-content-release
    runs-on: [self-hosted, Linux, X64, certigo-ci]
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_LOGIN_PRE_CLEANUP: true
      AZURE_LOGIN_POST_CLEANUP: true
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked tooling
        run: npm ci
      - name: Rebuild and verify complete release
        shell: bash
        env:
          EXPECTED_RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          EXPECTED_PUBLIC_MANIFEST_ID: ${{ needs.plan.outputs.public_manifest_id }}
          EXPECTED_PRIVATE_MANIFEST_ID: ${{ needs.plan.outputs.private_manifest_id }}
        run: |
          npm run package
          npm run package:verify
          node --input-type=module -e "
            import fs from 'node:fs';
            const release = JSON.parse(fs.readFileSync('dist/release.json', 'utf8'));
            if (release.releaseId !== process.env.EXPECTED_RELEASE_ID ||
                release.publicManifestId !== process.env.EXPECTED_PUBLIC_MANIFEST_ID ||
                release.privateManifestId !== process.env.EXPECTED_PRIVATE_MANIFEST_ID) {
              throw new Error('release reconstruite differente du plan approuve');
            }
          "
      - name: Validate release environment variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          EXPECTED_CLIENT_ID: ${{ needs.plan.outputs.release_client_id }}
          EXPECTED_STORAGE_TARGET: ${{ needs.plan.outputs.release_storage_target }}
        run: |
          : "${AZURE_CLIENT_ID:?Configure AZURE_CLIENT_ID in azure-content-release}"
          : "${AZURE_TENANT_ID:?Configure AZURE_TENANT_ID in azure-content-release}"
          : "${AZURE_SUBSCRIPTION_ID:?Configure AZURE_SUBSCRIPTION_ID in azure-content-release}"
          : "${AZURE_RESOURCE_GROUP:?Configure AZURE_RESOURCE_GROUP in azure-content-release}"
          : "${AZURE_STORAGE_ACCOUNT:?Configure AZURE_STORAGE_ACCOUNT in azure-content-release}"
          : "${AZURE_STORAGE_CONTAINER:?Configure AZURE_STORAGE_CONTAINER in azure-content-release}"
          test "${AZURE_CLIENT_ID,,}" = "${EXPECTED_CLIENT_ID}"
          test "${AZURE_STORAGE_ACCOUNT}/${AZURE_STORAGE_CONTAINER}" = "${EXPECTED_STORAGE_TARGET}"
      - name: Login to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Publish release descriptor last
        shell: bash
        env:
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          bash tools/publish_blob_artifact.sh dist/release.json \
            "${AZURE_RESOURCE_GROUP}" "${AZURE_STORAGE_ACCOUNT}" "${AZURE_STORAGE_CONTAINER}" \
            "releases/${RELEASE_ID}" "private,no-store" releaseId
