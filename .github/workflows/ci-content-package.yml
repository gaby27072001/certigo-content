name: ci-content-package

on:
  workflow_dispatch:
    inputs:
      upload_github_artifacts:
        description: Upload temporary GitHub artifacts (requires available quota)
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-content-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-gates:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # PORTEUR pour `npm test`. Le test « reconstruit a l'identique
          # l'artefact publie a la revision #25 » materialise cette revision via
          # `git archive`, ce qui exige l'historique git complet. Le defaut de
          # actions/checkout est fetch-depth: 1, qui ne fournit qu'un seul
          # commit : le test echouerait sur « Not a valid object name 87ae817 ».
          # Cout mesure le 2026-09-07 : historique complet = 2,47 MiB, 106 commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked tooling
        run: npm ci

      - name: Test packaging and leak gates
        run: npm test

      - name: Enforce certification catalog freshness
        run: npm run catalog:freshness

      # Regle « expand avant usage » : le paquet doit etre accepte par la copie
      # des schemas embarques du backend Certigo (config/backend-accepted-schemas),
      # sinon l'import refuserait une release deja publiee, donc irreversible.
      - name: Enforce backend content contract (expand before use)
        run: npm run contract:backend

      - name: Enforce global artifact download policy
        run: npm run policy:artifact-access

  package-public:
    needs: package-gates
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked tooling
        run: npm ci

      - name: Build public artifact in a clean dist
        run: npm run package:public

      - name: Verify final public artifact
        run: npm run package:verify:public

      - name: Resolve public artifact identity
        id: identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_github_artifacts == true }}
        shell: bash
        run: |
          node -e "const fs=require('fs');const m=require('./dist/public/manifest.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'artifact_name=certigo-content-public-'+m.manifestId.replace(':','-')+'\n');"

      - name: Publish public artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_github_artifacts == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: dist/public
          if-no-files-found: error
          retention-days: 90

  package-private:
    needs: package-gates
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked tooling
        run: npm ci

      - name: Build private artifact in a clean dist
        run: npm run package:private

      - name: Verify final private artifact
        run: npm run package:verify:private

      - name: Resolve private artifact identity
        id: identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_github_artifacts == true }}
        shell: bash
        run: |
          node -e "const fs=require('fs');const m=require('./dist/private/manifest.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'artifact_name=certigo-content-private-'+m.manifestId.replace(':','-')+'\n');"

      - name: Publish private artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_github_artifacts == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: dist/private
          if-no-files-found: error
          retention-days: 30
