name: ci-content

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "content/**"
      - "schemas/**"
      - "tools/validate_content.mjs"
      - ".github/workflows/ci-content.yml"
  pull_request:
    paths:
      - "content/**"
      - "schemas/**"
      - "tools/validate_content.mjs"
      - ".github/workflows/ci-content.yml"

concurrency:
  group: ci-content-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # CI-01 fork-guard: skip on pull_request events originating from forks.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: ${{ github.event_name == 'pull_request' && 'pr-ci' || '' }}
    runs-on: ${{ vars.PR_RUNNER_LABELS && fromJSON(vars.PR_RUNNER_LABELS) || fromJSON('["self-hosted","Linux","X64","certigo-ci"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install validator dependencies
        run: npm install --no-save ajv ajv-formats glob

      - name: Validate content
        run: node tools/validate_content.mjs
